services:
  api:
    build:
      context: .
      dockerfile: src/ReviewOrchestrator.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ResetOnStartup: "true"
    ports:
      - "5080:8080"

  web:
    build:
      context: src/ReviewOrchestrator.Web
    depends_on:
      - api
    ports:
      - "8080:80"
